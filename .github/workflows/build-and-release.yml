name: Build and Release (Velopack)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      channel:
        description: 'Release channel (e.g. stable, beta)'
        required: true
        default: 'stable'
      is_prerelease:
        description: 'Mark as GitHub Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Pack Velopack Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine Release Version & Tag
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = if ("${{ github.event.inputs.version }}".StartsWith('v')) { "${{ github.event.inputs.version }}" } else { "v$ver" }
          } elseif ("${{ github.event_name }}" -eq "release") {
            $rawTag = "${{ github.event.release.tag_name }}"
            $ver = $rawTag.TrimStart('v')
            $tag = $rawTag
          } else {
            $rawTag = "${{ github.ref_name }}"
            $ver = $rawTag.TrimStart('v')
            $tag = $rawTag
          }
          Write-Host "Releasing version: $ver with tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk

      - name: Fetch Previous Release for Delta Generation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path ./releases
          Write-Host "Fetching previous release from GitHub to calculate delta update..."
          try {
            vpk download github `
              --repoUrl "https://github.com/${{ github.repository }}" `
              --token $env:GITHUB_TOKEN `
              --channel "stable" `
              --outputDir ./releases
            Write-Host "Previous release packages ready in ./releases for delta diffing."
          } catch {
            Write-Host "Initial release or previous release not found. Proceeding with full package."
          }

      - name: Restore NuGet Packages
        run: dotnet restore WinFormsApp1/WinFormsApp1.csproj

      - name: Publish WinForms Application (Self-Contained win-x64)
        run: |
          dotnet publish WinFormsApp1/WinFormsApp1.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.get_version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.get_version.outputs.version }}.0 `
            -o ./publish

      - name: Package with Velopack (vpk pack with Delta BestSize)
        shell: pwsh
        run: |
          # Package the release into ./releases with BestSize delta compression and no redundant portable zip
          vpk pack `
            --packId VelopackUpdateTest `
            --packVersion ${{ steps.get_version.outputs.version }} `
            --packDir ./publish `
            --mainExe VelopackUpdateTest.exe `
            --outputDir ./releases `
            --channel "stable" `
            --delta BestSize `
            --noPortable

      - name: Clean Redundant Assets
        shell: pwsh
        run: |
          # Remove any portable zip files to save storage and keep only setup, delta, and full packages
          Get-ChildItem -Path ./releases -Filter "*.zip" -Recurse | Remove-Item -Force -Verbose
          Write-Host "Cleaned assets list:"
          Get-ChildItem ./releases | Select-Object Name, Length

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: Velopack-Release-${{ steps.get_version.outputs.version }}
          path: ./releases/*

      - name: Upload Assets to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.get_version.outputs.tag }}"
          Write-Host "Uploading Velopack assets to GitHub Release tag: $tag"
          
          # Upload files directly to the GitHub Release using GitHub CLI
          $files = Get-ChildItem ./releases/* | ForEach-Object { $_.FullName }
          gh release upload $tag $files --clobber
