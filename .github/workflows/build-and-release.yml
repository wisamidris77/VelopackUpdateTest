name: Build and Release (Velopack)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      channel:
        description: 'Release channel (e.g. stable, beta)'
        required: true
        default: 'stable'
      is_prerelease:
        description: 'Mark as GitHub Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Pack Velopack Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine Release Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Host "Releasing version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk

      - name: Restore NuGet Packages
        run: dotnet restore WinFormsApp1/WinFormsApp1.csproj

      - name: Publish WinForms Application (Self-Contained win-x64)
        run: |
          dotnet publish WinFormsApp1/WinFormsApp1.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.get_version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.get_version.outputs.version }}.0 `
            -o ./publish

      - name: Package with Velopack (vpk pack)
        shell: pwsh
        run: |
          # Package the release into ./releases
          vpk pack `
            --packId VelopackUpdateTest `
            --packVersion ${{ steps.get_version.outputs.version }} `
            --packDir ./publish `
            --mainExe VelopackUpdateTest.exe `
            --outputDir ./releases `
            --channel ${{ github.event.inputs.channel || 'stable' }}

      - name: Upload Artifacts (Setup and Deltas)
        uses: actions/upload-artifact@v4
        with:
          name: Velopack-Release-${{ steps.get_version.outputs.version }}
          path: ./releases/*

      - name: Publish to GitHub Releases (Velopack vpk upload)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prereleaseArg = if ("${{ github.event.inputs.is_prerelease }}" -eq "true") { "--prerelease" } else { "" }
          
          # Upload packages directly to GitHub Releases and generate delta index
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:GITHUB_TOKEN `
            --channel ${{ github.event.inputs.channel || 'stable' }} `
            --tag "v${{ steps.get_version.outputs.version }}" `
            --outputDir ./releases `
            $prereleaseArg
